<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Exercise 3</title>
</head>

<body>
    <style>
        .shadow-button {
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            font-size: 14px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 3px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
        }

        .shadow-button:active {
            margin-right: 3px;
            margin-left: 3px;
            box-shadow: none;
        }
    </style>
    <button class="shadow-button">Shadow</button>

</body>

</html>
