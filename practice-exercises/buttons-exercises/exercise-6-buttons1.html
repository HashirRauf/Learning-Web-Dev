<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Exercise 1</title>
</head>

<body>
    <style>
        .title {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }

        .back-button {
            font-size: 16px;
            padding-top: 8px;
            padding-bottom: 8px;
            margin-right: 5px;
        }

        .next-button {
            font-size: 16px;
            padding-top: 8px;
            padding-bottom: 8px;
            margin-left: 5px;
        }

        .search {
            margin-right: 5px;
            margin-left: 5px;
        }
    </style>
    <h2 class="title"><u>Pagination</u></h3>
        <button class="back-button">Back</button>
        <a class="search" href="https://www.google.com/">1</a>
        <a class="search" href="https://www.google.com/">2</a>
        <a class="search" href="https://www.google.com/">3</a>
        <a class="search" href="https://www.google.com/">4</a>
        <a class="search" href="https://www.google.com/">5</a>
        <button class="next-button">Next</button>


</body>

</html>
