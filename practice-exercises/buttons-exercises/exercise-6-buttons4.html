<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Exercise 4</title>
</head>

<body>
    <style>
        .button {
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 15px;
            padding-right: 15px;
            font-size: 18px;
            cursor: pointer;
            background-color: aqua;
            color: black;
            border: none;
            border-radius: 8px;
            margin-left: 10px;
            margin-right: 10px;
            transition: padding 0.3s,
                margin 0.3s;
        }

        .button:hover {
            padding-left: 25px;
            padding-right: 25px;
            margin-left: 0px;
            margin-right: 0px;
        }
    </style>
    <button class="button">One</button>
    <button class="button">Two</button>
    <button class="button">Three</button>

</body>

</html>
