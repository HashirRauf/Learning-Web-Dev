<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons Exercise 2</title>
</head>

<body>
    <style>
        .stretch-button {
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            font-size: 14px;
            background-color: green;
            color: white;
            border: none;
            border-radius: 3px;
            transition: padding 1s;
        }

        .stretch-button:hover {
            padding-left: 25px;
            padding-right: 25px;
            padding-top: 15px;
            padding-bottom: 15px;
            font-size: 18px;
        }
    </style>
    <button class="stretch-button">Stretch</button>

</body>

</html>
