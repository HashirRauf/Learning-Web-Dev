<!--Use <br> and <hr> tags to display a piece of text with line breaks-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Br and hr tags</title>
</head>

<body>
    <hr>
    <h3>The above horizontal line is called a hr tag, that creates a horizontal ruler</h3>
    <p>This is the first line of text <br>
        This text appears on a new line because of a line break
    </p>
    <hr>
    <p>Here is another horizontal line above.</p>

</body>

</html>
