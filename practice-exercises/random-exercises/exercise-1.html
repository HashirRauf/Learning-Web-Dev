<!--Create an HTML page with a heading (title heading), a primary heading and a 
subheading. Which tags did you use? -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Title</title>
</head>

<body>
    <u>
        <h1>This is my Main Website Heading</h1>
    </u>
    <h4>This is my sub-heading</h4>

    <!--I used <title> for title heading, <h1> for primary heading and <h4> for sub-heading-->


</body>

</html>
