<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>span and div Tags</title>
</head>

<body>
    <!--The main difference between span and div tags is that div is a  block level element and span is a inline element-->
    <dl>
        <ul>
            <li>
                <u>
                    <dl>Div Tags</dl>
                </u>
                <div style="background-color: aqua; padding: 10px;">
                    <dd>Div Tags take over all the horizontal width.</dd>
                </div>
                <div style="background-color: lightsalmon;padding: 10px;">
                    <dd>This is another div</dd>
                </div>
            </li>
        </ul>
    </dl>


    <h3>Span Tags</h3>
    <p>You can use span tag to change the color of <span style="background-color: lightgreen;">these specific
            keywords</span> without breaking the paragraph</p>

</body>

</html>
