<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Lits in HTML</title>
</head>

<body>
    <!--There are three types of Lists in HTML-->
    <!--No 1 is: Un-ordered List-->
    <!--No 2 is: Ordered List-->
    <!--No 3 is: Description List-->

    <!--  Un-ordered List  -->
    <u><h4>Un-Ordered List</h4></u>
    <ul>
        <li>Pizza</li>
        <li>Burger</li>
        <li>Mushrooms</li>
    </ul>
    <hr>
     <!--  Ordered List  -->
    <u><h4>Ordered List</h4></u>
    <ol type="i">
        <li>Wake up at 5 AM</li>
        <li>Have Breakfast</li>
        <li>Go to Work</li>
    </ol>
    <hr>
     <!--  Description List  -->
    <u><h4>Description List</h4></u>
    <dl>
        <b><dt>HTML</dt></b>
        <dd>HTML is a web developement markup language.</dd>
    </dl>
    <h4></h4>

</body>

</html>
