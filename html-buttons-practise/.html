<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons Challenge</title>
</head>

<body>
  <a style="font-size: 18px; font-family: 'Times New Roman', Times, serif; color: rgb(0 , 113 , 133);"
    href="https://www.amazon.com/" target="_blank">Back to Amazon</a>

  <h1>Nike Black Running Shoes</h1>
  <h2 style="color: rgb(0 , 118 , 0);">$39 - in stock.</h2>
  <p style="font-size: 21px;">Free delivery tomorrow</p>

  <style>
    .add-to-cart-but {
      background-color: rgb(255, 216, 30);
      color: black;
      font-family: Arial, Helvetica, sans-serif;
      height: 38px;
      width: 143px;
      border-width: 1px;
      cursor: pointer;
      border-radius: 20px;
      font-size: 17px;
      margin-right: 12px;
    }

    .buy-now-but {
      background-color: rgb(255, 164, 28);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 17px;
      height: 38px;
      width: 143px;
      border-radius: 20px;
      border-width: 1px;
      cursor: pointer;
    }
  </style>

  <button class="add-to-cart-but">Add to Cart</button>
  <button class="buy-now-but">Buy now</button>


</body>

</html>
