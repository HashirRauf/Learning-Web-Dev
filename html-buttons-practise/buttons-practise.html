<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buttons Practise</title>
</head>

<body>
  <style>
    .uber-button {
      background-color: black;
      color: white;
      margin-right: 10px;
      height: 35px;
      width: 113px;
      border: none;
      cursor: pointer;
    }

    .amazon-button {
      background-color: rgb(255, 216, 20);
      color: black;
      width: 170px;
      height: 35px;
      font-size: 14px;
      border-width: 1px;
      border-radius: 25px;
      cursor: pointer;
      margin: auto;
    }

    .github-button {
      background-color: rgb(46, 164, 79);
      color: white;
      width: 90px;
      height: 34px;
      font-size: 14px;
      border-width: 1px;
      border-radius: 5px;
      cursor: pointer;
    }

    .bootstramp-but1 {
      background-color: rgb(121, 82, 179);
      color: white;
      height: 40px;
      width: 105px;
      border-radius: 3px;
      border-width: 1px;
      cursor: pointer;
      margin-right: 6px;
    }

    .bootstramp-but2 {
      background-color: white;
      color: rgb(167, 94, 158);
      height: 40px;
      width: 105px;
      border-radius: 3px;
      border-width: 1px;
      cursor: pointer;
      margin-right: 6px;
      border-color: rgb(58, 21, 94);
      border-style: solid;
      font-size: 13px;
    }

    .linkedin-but1 {
      background-color: rgb(10, 102, 194);
      color: white;
      height: 38px;
      border: none;
      border-radius: 20px;
      width: 215px;
      margin-right: 5px;
      font-size: 14px;
    }

    .linkedin-but2 {
      background-color: white;
      color: rgb(10, 102, 194);
      height: 38px;
      width: 70px;
      border-radius: 20px;
      border-width: 1px;
      border-color:rgb(10, 102, 194);
      border-style: solid;
    }
  </style>




  <button class="uber-button">Request now</button>
  <button class="amazon-button">Add to Cart</button>
  <button class="github-button">Sign up</button>
  <br>
  <br>
  <button class="bootstramp-but1">Get Started</button>
  <button class="bootstramp-but2">Download</button>
  <button class="linkedin-but1">Apply on company website</button>
  <button class="linkedin-but2">Save</button>

</body>

</html>
