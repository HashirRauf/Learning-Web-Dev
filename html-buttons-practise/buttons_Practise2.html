<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buttons and CSS Practise</title>
    <link rel="icon" type="image/png" href="pic.png">
</head>

<body>
    <style>
        .subscribe-button {
            background-color: rgb(198, 9, 9);
            color: white;
            border-color: black;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 8px;
            border: none;
            transition: opacity 0.2s;
            vertical-align: top;
        }

        .subscribe-button:hover {
            opacity: 0.7;
        }

        .subscribe-button:active {
            opacity: 0.3;
        }

        .join-button {
            background-color: white;
            border-style: solid;
            border-radius: 5px;
            border-width: 1px;
            cursor: pointer;
            padding-top: 9px;
            padding-bottom: 9px;
            padding-left: 16px;
            padding-right: 16px;
            border-color: rgb(41, 118, 211);
            color: rgb(41, 118, 211);
            margin-right: 8px;
            transition: background-color 1s, color 1s;
        }

        .join-button:hover {
            background-color: rgb(41, 118, 211);
            color: white;
        }

        .join-button:active {
            opacity: 0.7;
        }

        .tweet-button {
            background-color: rgb(2, 158, 255);
            color: white;
            border-width: 1px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius: 20px;
            border: none;
            cursor: pointer;
            transition: box-shadow 0.15s;
        }

        .tweet-button:hover {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.15);

        }
    </style>
    <button class="subscribe-button">SUBSCRIBE</button>
    <button class="join-button">JOIN</button>
    <button class="tweet-button">Tweet</button>

</body>

</html>
