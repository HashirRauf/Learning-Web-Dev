<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attaching Images in html</title>
</head>
<body>
    <h3 align="center">This is Robin with no alt text and title</h1>
    <br>
    <img src="images/robin.jpg" width="100" style="display: block; margin: 0 auto;">
    <hr>
    <br>
    <h3 align="center">This is Robin with alt text and title</h1>
    <br>
    <img src="images/robin.jpg" alt="Robin" title="Hello! My name is Robin" width="100" style="display: block; margin: 0 auto;">
    <hr>
    
</body>
</html>
