<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in HTML</title>
</head>
<body>
    <table bgcolor="black" width="350" height="75">
        <tr bgcolor="grey">
            <th>Red Led</th>
            <th>Blue Led</th>
            <th>Buzzer Led</th>
            <th>Yellow Led</th>
        </tr>
        <tr bgcolor="lightgrey">
            <th>ON</th>
            <th>OFF</th>
            <th>ON</th>
            <th>ON</th>
        </tr>
    </table>
    
</body>
</html>
