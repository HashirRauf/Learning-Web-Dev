<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyperLinks Practise</title>
</head>

<body>
    <!--The Anchor Tag-->
    <!--Here this will oprn Google or any other link in the current tab-->
    <a href="https://www.google.com/">Click here to Open Google(Open in current tab)</a>

    <!--To Open link in a new tab Target command is used-->
    <hr> <!--Horizontal ruler-->
    <a href="https://www.google.com/" target="_blank">Click here to open Google in a new tab</a>

    <hr>
    <!--If I want to add a msg whenever a user hover its cursor on it, titel command is used-->
    <a href="https://www.google.com/" target="_blank" title="This Link will Open Google">Click and hover on me</a>

</body>

</html>
